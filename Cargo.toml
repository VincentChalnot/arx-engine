[package]
name = "keres"
version = "0.1.0"
edition = "2021"
authors = ["Vincent Chalnot"]
description = "A library for the abstract game Keres"

[features]
# Native minifb GUI binary. Off by default so the server/CLI stay free of the
# X11/minifb dependency (keeps the Docker server build clean).
gui = ["dep:minifb"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rayon = "1.10"
ahash = "0.8.12"
once_cell = "1.21.3"
mimalloc = "0.1.48"
minifb = { version = "0.28", default-features = false, features = ["x11"], optional = true }

[lib]
name = "keres_engine"
path = "src/lib.rs"

[[bin]]
name = "keres"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[profile.profiling]
inherits = "release"
debug = 1

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.x86_64-unknown-linux-musl.dependencies]
mimalloc = "0.1.43"
