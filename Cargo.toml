[package]
name = "keres"
version = "0.1.0"
edition = "2021"
authors = ["Vincent Chalnot"]
description = "A library for the abstract game Keres"

[features]
# Native minifb GUI binary. Off by default so the server/CLI stay free of the
# X11/minifb dependency (keeps the Docker server build clean).
gui = ["dep:minifb"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rayon = "1.10"
ahash = "0.8.12"
once_cell = "1.21.3"
mimalloc = "0.1.48"
minifb = { version = "0.28", default-features = false, features = ["x11"], optional = true }

[lib]
name = "keres_engine"
path = "src/lib.rs"

[[bin]]
name = "keres"
path = "src/main.rs"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[profile.release]
# Production profile for the server + CLI: speed first (the AI search is
# latency-critical), but keep what's free — fat LTO and a single codegen unit
# shrink the binary while improving runtime, and strip drops debug symbols.
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.gui]
# Size-minimized profile for the native GUI binary (micro-keres lineage: the
# <1.44 MB contest target). `panic = "abort"` drops the unwind tables; `z`
# trades a little AI-search speed the GUI never notices for smallest codegen.
inherits = "release"
opt-level = "z"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[target.x86_64-unknown-linux-musl.dependencies]
mimalloc = "0.1.43"
